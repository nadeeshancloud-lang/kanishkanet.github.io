<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="fade-in dashboard-body">
    
    <nav class="glass-nav">
        <div class="logo">
            <i class="fa-solid fa-layer-group"></i> NEXUS
        </div>
        
        <div class="profile-menu">
            <div class="avatar-circle" id="profile-avatar-btn">
                <img id="nav-avatar" src="https://via.placeholder.com/150" alt="Avatar">
            </div>
            <div class="dropdown-menu glass-card" id="dropdown">
                <div class="dropdown-header">
                    <p id="drop-name" class="fw-bold">Loading...</p>
                    <p id="drop-email" class="text-muted">...</p>
                </div>
                <hr>
                <button id="logout-btn" class="dropdown-item">
                    <i class="fa-solid fa-right-from-bracket"></i> Disconnect
                </button>
            </div>
        </div>
    </nav>

    <main class="dashboard-content">
        <div class="glass-card welcome-card">
            <h1>Welcome back, <span id="welcome-name" class="neon-text">Operative</span>.</h1>
            <p>Your secure session is active. All systems nominal.</p>
            
            <div class="profile-stats">
                <div class="stat-box glass-card">
                    <img id="main-avatar" src="https://via.placeholder.com/150" alt="User" class="large-avatar">
                    <h3 id="main-email">Loading data...</h3>
                    <p class="status-badge">Authenticated</p>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="script.js"></script>
</body>
</html>
