<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Secure Access</title>
    <link rel="stylesheet" href="auth-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="fade-in">
    <div id="particles"></div>

    <div class="auth-container">
        <div class="glass-card" id="tilt-card">
            <div class="card-header">
                <div class="logo">
                    <i class="fa-solid fa-layer-group"></i> NEXUS
                </div>
                <h2 id="form-title">Sign in to continue</h2>
                <p id="error-message" class="error-text"></p>
            </div>

            <div class="oauth-group">
                <button class="btn oauth-btn ripple" id="google-login">
                    <i class="fa-brands fa-google"></i> Google
                </button>
                <button class="btn oauth-btn ripple" id="apple-login">
                    <i class="fa-brands fa-apple"></i> Apple
                </button>
            </div>

            <div class="divider">
                <span>OR</span>
            </div>

            <form id="auth-form">
                <div class="input-group">
                    <i class="fa-solid fa-envelope icon"></i>
                    <input type="email" id="email" placeholder="Email address" required>
                </div>
                
                <div class="input-group">
                    <i class="fa-solid fa-lock icon"></i>
                    <input type="password" id="password" placeholder="Password" required>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember">
                        <span class="checkmark"></span> Remember me
                    </label>
                    <a href="#" id="forgot-password" class="text-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn primary-btn ripple" id="submit-btn">
                    <span id="btn-text">Initialize Session</span>
                    <i class="fa-solid fa-circle-notch fa-spin loader" id="btn-loader"></i>
                </button>
            </form>

            <div class="card-footer">
                <p id="toggle-text">New to Nexus? <a href="#" id="toggle-auth" class="text-link">Establish an identity</a></p>
            </div>
        </div>
    </div>

    <script type="module" src="auth-script.js"></script>
    <script type="module">
  // Firebase App සහ Authentication සඳහා අවශ්‍ය Libraries ගෙන්වා ගැනීම
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-app.js";
  import { getAuth } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-auth.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-analytics.js";

  // ඔයාගේ Firebase Configuration එක
  const firebaseConfig = {
  apiKey: "AIzaSyD7hHeJfN7uhSibgFEv9Kfk534Qv-3v4oo",
  authDomain: "loginkanishka.firebaseapp.com",
  databaseURL: "https://loginkanishka-default-rtdb.firebaseio.com",
  projectId: "loginkanishka",
  storageBucket: "loginkanishka.firebasestorage.app",
  messagingSenderId: "1096061058024",
  appId: "1:1096061058024:web:f1973799a1393c98c0c25d"
  };

  // Firebase Initialize කිරීම
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app); // Authentication පාවිච්චි කරන්න මේක ඕනේ
  const analytics = getAnalytics(app);

  console.log("Firebase සාර්ථකව සම්බන්ධ වුණා!");

  // මීට පස්සේ ඔයා ලියන Login/Sign-up functions මේ ඇතුළෙම ලියන්න පුළුවන්
</script>
</body>
</html>
